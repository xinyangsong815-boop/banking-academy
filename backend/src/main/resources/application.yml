server:
  port: ${PORT:18080}
  error:
    include-message: never
spring:
  application:
    name: banking-academy
  profiles:
    default: demo
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/academy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: false
logging:
  pattern:
    level: '%5p [trace:%X{traceId:-}]'
academy:
  session-hours: 8
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
